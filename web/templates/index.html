<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Girlfriend Chat</title>
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- 图标字体 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body class="bg-cream min-h-screen">
    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        
        <!-- 标题栏 -->
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-warm-pink mb-2">
            </h1>
            <p class="text-gray-600 text-sm">
                Virtual Girlfriend Chat ~ ✨
            </p>
        </header>
        
        <!-- 聊天容器 -->
        <div class="flex flex-col lg:flex-row gap-6 h-chat">
            
            <!-- 左侧：虚拟女友形象区域 -->
            <aside class="lg:w-80 flex-shrink-0">
                <div class="bg-white rounded-3xl shadow-lg p-6 sticky top-6">
                    <!-- 女友头像 -->
                    <div class="flex flex-col items-center">
                        <div class="w-32 h-32 rounded-full bg-gradient-to-br from-pink-200 to-pink-300 flex items-center justify-center mb-4 shadow-md overflow-hidden">
                            <img class="w-full h-full object-cover" src="{{ url_for('static', filename='images/girlfriend.jpg') }}" alt="Girlfriend">
                        </div>
                        
                    </div>
                    
                    <!-- 状态信息 -->
                    <div class="border-t border-gray-200 pt-4 mt-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm text-gray-600">在线状态</span>
                            <span class="flex items-center text-green-500">
                                <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                                在线
                            </span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">聊天记录</span>
                            <span class="text-sm text-warm-pink" id="message-count">0 条</span>
                        </div>
                    </div>

                    <!-- 模型选择 -->
                    <div class="border-t border-gray-200 pt-4 mt-4">
                        <label for="model-provider" class="block text-sm text-gray-600 mb-2">模型服务</label>
                        <select
                            id="model-provider"
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm focus:outline-none focus:border-warm-pink"
                            onchange="handleProviderChange()">
                            <option value="mock">模拟模式</option>
                        </select>
                        <label for="model-name" class="block text-sm text-gray-600 mt-3 mb-2">模型名称</label>
                        <input
                            id="model-name"
                            type="text"
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-warm-pink"
                            placeholder="使用预设默认模型">
                        <label for="model-base-url" class="block text-sm text-gray-600 mt-3 mb-2">Base URL</label>
                        <input
                            id="model-base-url"
                            type="text"
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-warm-pink"
                            placeholder="使用预设默认地址">
                        <label for="model-api-key" class="block text-sm text-gray-600 mt-3 mb-2">API Key</label>
                        <input
                            id="model-api-key"
                            type="password"
                            autocomplete="off"
                            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-warm-pink"
                            placeholder="留空表示不修改已保存Key">
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button
                                onclick="saveModelConfig()"
                                class="bg-warm-pink hover:bg-pink-400 text-white py-2 px-3 rounded-lg transition-colors duration-200 text-sm font-medium">
                                保存配置
                            </button>
                            <button
                                onclick="clearSavedApiKey()"
                                class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-3 rounded-lg transition-colors duration-200 text-sm font-medium">
                                清除Key
                            </button>
                        </div>
                        <div id="model-status" class="mt-2 text-xs text-gray-500"></div>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div class="mt-6">
                        <button 
                            onclick="clearHistory()" 
                            class="w-full bg-red-100 hover:bg-red-200 text-red-600 py-2 px-4 rounded-full transition-colors duration-200 text-sm font-medium">
                            🗑️ 清空聊天记录
                        </button>
                    </div>
                </div>
            </aside>
            
            <!-- 右侧：聊天区域 -->
            <main class="flex-1 flex flex-col bg-white rounded-3xl shadow-lg overflow-hidden">
                
                <!-- 聊天消息区域 -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 scroll-smooth">
                    <!-- 欢迎消息 -->
                    <div class="flex items-start space-x-3 animate-fade-in">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-200 to-pink-300 flex items-center justify-center flex-shrink-0 overflow-hidden">
                            <span class="text-xl"></span>
                        </div>
                        <div class="flex flex-col max-w-md">
                            <div class="bg-girlfriend-bubble text-gray-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm">
                                <p class="mt-1">有什么想跟我说的吗？我一直在这里陪着你哦~ ✨</p>
                            </div>
                            <span class="text-xs text-gray-400 mt-1 ml-2" id="welcome-time"></span>
                        </div>
                    </div>
                </div>
                
                <!-- 输入区域 -->
                <div class="border-t border-gray-200 p-4 bg-gray-50">
                    
                    <!-- 加载提示 -->
                    <div id="loading-indicator" class="hidden mb-3 text-center">
                        <span class="inline-flex items-center text-sm text-gray-500">
                            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-warm-pink" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            正在输入中...
                        </span>
                    </div>
                    
                    <!-- 输入框和按钮 -->
                    <div class="flex space-x-2">
                        <!-- 图片上传按钮 -->
                        <label class="cursor-pointer bg-warm-yellow hover:bg-yellow-200 text-gray-700 p-3 rounded-xl transition-colors duration-200 flex-shrink-0">
                            <span class="text-xl">📷</span>
                            <input 
                                type="file" 
                                id="image-upload" 
                                accept="image/*" 
                                class="hidden" 
                                onchange="handleImageUpload(event)">
                        </label>
                        
                        <!-- 文本输入框 -->
                        <div class="flex-1 relative">
                            <textarea 
                                id="message-input" 
                                rows="1"
                                placeholder="输入消息... 💬" 
                                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-warm-pink resize-none overflow-hidden"
                                maxlength="500"
                                onkeydown="handleKeyPress(event)"
                                oninput="adjustTextareaHeight(this)"></textarea>
                            <span class="absolute bottom-2 right-3 text-xs text-gray-400" id="char-count">0/500</span>
                        </div>
                        
                        <!-- 发送按钮 -->
                        <button 
                            onclick="sendMessage()" 
                            id="send-button"
                            class="bg-warm-pink hover:bg-pink-400 text-white px-6 py-3 rounded-xl transition-colors duration-200 font-medium flex-shrink-0">
                            发送 ✉️
                        </button>
                    </div>
                </div>
                
            </main>
            
        </div>
        
    </div>
    
    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    
    <script>
        // 设置欢迎消息时间
        document.getElementById('welcome-time').textContent = formatTime(new Date().toISOString());
        
        // 页面加载时获取聊天历史
        window.addEventListener('DOMContentLoaded', () => {
            loadChatHistory();
        });
    </script>
</body>
</html>
